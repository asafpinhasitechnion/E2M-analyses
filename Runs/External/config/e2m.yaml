# Settings for src/run_external.py. Paths are relative to Runs/External.
# TCGA data, preprocessing (CPM or counts; --normalization overrides) and model settings come from the TCGA run's config;
# the `data` block below only replaces its target-selection rule.

run:
  tcga_config: ../TCGA/config/e2m.yaml
  tcga_data_dir: ../TCGA/data
  external_root: data/external
  min_site_samples: 20
  umap: true

# TCGA training targets: genes mutated in at least 3% and at least 10 of the TCGA training samples, no cap.
data:
  min_mutation_prevalence: 0.03
  min_mutation_positives: 10
  max_mutation_targets: 0

# Per cohort: TCGA cancer types ("all" = the cancer types of the TCGA run), TCGA expression file,
# the scale of the cohort's expression (counts | tpm | log), and the integration methods; the first method is the main result.
# target_ranking: the top_n targets by normalized AUPRC in a TCGA cross-validation metrics file (marked in the outputs);
# {variant} is the run variant's subfolder: empty for CPM (the default), counts without CPM (from the TCGA config or --normalization).
cohorts:
  CPTAC_CMI:
    data_dir: CMI_CPTAC
    tcga_cancers: all
    tcga_expression: star_counts
    scale: counts
    methods: [sample_rank]

  IMMUNOPOG:
    data_dir: IMMUNOPOG
    tcga_cancers: all
    tcga_expression: star_counts
    scale: counts
    methods: [sample_rank]

  METABRIC:
    data_dir: METABRIC
    tcga_cancers: [BRCA]
    tcga_expression: star_tpm
    scale: log                # Illumina microarray, already log-scaled
    methods: [sample_rank, combat]   # combat: per-gene batch correction, compared for the microarray

  HUGO:
    data_dir: HUGO
    tcga_cancers: [SKCM]
    tcga_expression: star_counts
    scale: counts
    methods: [sample_rank, sample_rank_shared]
    target_ranking: {file: "../TCGA/output/{variant}/SKCM/cv/metrics.csv", top_n: 20}

  LIU:
    data_dir: LIU
    tcga_cancers: [SKCM]
    tcga_expression: star_counts
    scale: counts
    methods: [sample_rank, sample_rank_shared]
    target_ranking: {file: "../TCGA/output/{variant}/SKCM/cv/metrics.csv", top_n: 20}

  RIAZ:
    data_dir: RIAZ
    tcga_cancers: [SKCM]
    tcga_expression: star_counts
    scale: counts
    methods: [sample_rank, sample_rank_shared]
    target_ranking: {file: "../TCGA/output/{variant}/SKCM/cv/metrics.csv", top_n: 20}

  VAN_ALLEN:
    data_dir: VAN_ALLEN
    tcga_cancers: [SKCM]
    tcga_expression: star_tpm
    scale: tpm
    methods: [sample_rank]
    target_ranking: {file: "../TCGA/output/{variant}/SKCM/cv/metrics.csv", top_n: 20}

  MORRISON:
    data_dir: MORRISON
    tcga_cancers: [SKCM]
    tcga_expression: star_counts
    scale: log                # provided as batch-corrected logCPM
    methods: [rank]           # per-gene rank: predicts better than sample_rank here
    target_ranking: {file: "../TCGA/output/{variant}/SKCM/cv/metrics.csv", top_n: 20}

# Models shared by several cohorts (method <name> of each): one model trained once on TCGA, on the genes all the cohorts
# share with TCGA (the intersection), and applied to each. The cohorts need the same TCGA data, scale and targets.
shared_models:
  sample_rank_shared: {cohorts: [HUGO, LIU, RIAZ], method: sample_rank}
